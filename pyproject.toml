[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-supply-guard"
version = "0.1.0"
description = "MCP tool-definition supply-chain integrity — hash pinning, post-approval change detection (rug-pull), command-injection risk scan. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wwb-bill" }]
keywords = ["mcp", "supply-chain", "security", "rug-pull", "integrity", "tools"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-supply-guard = "mcp_supply_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
